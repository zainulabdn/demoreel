<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumen</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --panel: #ffffff;
        --ink: #1c1b22;
        --muted: #6d6b7b;
        --line: #e7e5ee;
        --soft: #f1eff8;
        --accent: #6d4aff;
        --accent-ink: #ffffff;
        --done: #a3a1b1;
        --shadow: 0 1px 2px rgba(20, 18, 40, 0.06), 0 8px 24px rgba(20, 18, 40, 0.06);
      }
      [data-theme='dark'] {
        --bg: #111016;
        --panel: #1a1922;
        --ink: #f1f0f7;
        --muted: #9a98ab;
        --line: #2a2835;
        --soft: #23212e;
        --accent: #8f76ff;
        --accent-ink: #14121c;
        --done: #5f5d70;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
        background: var(--bg);
        transition: background 0.35s ease, color 0.35s ease;
        -webkit-font-smoothing: antialiased;
      }
      button, input { font: inherit; color: inherit; }
      .app { display: grid; grid-template-columns: 248px 1fr; height: 100%; }

      .sidebar {
        display: flex; flex-direction: column; gap: 6px;
        padding: 20px 14px; border-right: 1px solid var(--line); background: var(--panel);
        transition: background 0.35s ease, border-color 0.35s ease;
      }
      .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
      .brand svg { width: 26px; height: 26px; }
      .label { padding: 6px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      .project-link {
        display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px;
        border: 0; border-radius: 10px; background: transparent; text-align: left; cursor: pointer;
        transition: background 0.15s ease;
      }
      .project-link:hover { background: var(--soft); }
      .project-link.active { background: var(--soft); font-weight: 600; }
      .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
      .count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 500; }
      .new-project {
        display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: auto; padding: 10px 12px;
        border: 0; border-radius: 11px; background: var(--accent); color: var(--accent-ink);
        font-weight: 600; cursor: pointer; transition: transform 0.12s ease, filter 0.15s ease;
      }
      .new-project:hover { filter: brightness(1.07); }
      .new-project:active { transform: scale(0.97); }

      main { display: flex; flex-direction: column; min-width: 0; }
      .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 28px; }
      .search {
        display: flex; align-items: center; gap: 10px; width: 340px; padding: 9px 12px;
        border: 1px solid var(--line); border-radius: 11px; background: var(--panel); color: var(--muted);
        cursor: pointer; text-align: left; transition: border-color 0.15s ease, background 0.35s ease;
      }
      .search:hover { border-color: var(--accent); }
      .search span { flex: 1; }
      kbd {
        padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft);
        font: 600 11px/1.6 ui-sans-serif, system-ui, sans-serif; color: var(--muted);
      }
      .spacer { flex: 1; }
      .icon-button {
        display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 11px;
        background: var(--panel); cursor: pointer; transition: border-color 0.15s ease, background 0.35s ease;
      }
      .icon-button:hover { border-color: var(--accent); }
      .icon-button svg { width: 18px; height: 18px; }
      .avatar {
        display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
        background: linear-gradient(135deg, #ffb86b, #ff6b9a); color: #fff; font-weight: 700; font-size: 13px;
      }

      .project { width: min(760px, 100%); margin: 6px auto 0; padding: 18px 28px 40px; }
      .project-head {
        display: flex; align-items: center; gap: 24px; padding: 26px 28px; border: 1px solid var(--line); border-radius: 20px;
        background: var(--panel); box-shadow: var(--shadow); transition: background 0.35s ease, border-color 0.35s ease;
      }
      .eyebrow { margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
      h1 { margin: 0; font-size: 30px; line-height: 1.15; letter-spacing: -0.02em; }
      .summary { margin: 8px 0 0; color: var(--muted); }
      .ring { position: relative; flex: none; width: 92px; height: 92px; margin-left: auto; }
      .ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
      .ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
      .ring .track { stroke: var(--soft); }
      .ring .value { stroke: var(--accent); transition: stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.35s ease; }
      .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 19px; letter-spacing: -0.02em; }

      .add { margin: 18px 0 10px; }
      .add input {
        width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
        outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.35s ease;
      }
      .add input::placeholder { color: var(--muted); }
      .add input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }

      .tasks { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
      .task {
        display: flex; align-items: center; gap: 12px; padding: 13px 16px; border: 1px solid var(--line); border-radius: 14px;
        background: var(--panel); cursor: pointer; animation: rise 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        transition: border-color 0.15s ease, background 0.35s ease, transform 0.12s ease;
      }
      .task:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
      .task input { position: absolute; opacity: 0; pointer-events: none; }
      .box {
        display: grid; place-items: center; flex: none; width: 22px; height: 22px; border: 2px solid var(--done); border-radius: 7px;
        transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      }
      .box svg { width: 13px; height: 13px; stroke: var(--accent-ink); stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.25s ease 0.05s; }
      .task.done .box { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
      .task.done .box svg { stroke-dashoffset: 0; }
      .task span { transition: color 0.2s ease; }
      .task.done span { color: var(--done); text-decoration: line-through; }
      .empty { padding: 34px 16px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      .overlay {
        position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15, 13, 30, 0.42);
        opacity: 0; pointer-events: none; transition: opacity 0.18s ease; backdrop-filter: blur(3px);
      }
      .overlay.open { opacity: 1; pointer-events: auto; }
      .sheet {
        width: 440px; padding: 26px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel);
        box-shadow: 0 24px 70px rgba(10, 8, 30, 0.35); transform: translateY(10px) scale(0.98);
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .overlay.open .sheet { transform: none; }
      .sheet h2 { margin: 0 0 18px; font-size: 20px; letter-spacing: -0.01em; }
      .field { display: grid; gap: 7px; margin-bottom: 16px; font-size: 13px; font-weight: 600; color: var(--muted); }
      .field input {
        padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 15px; font-weight: 400;
        color: var(--ink); outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
      .swatches { display: flex; gap: 10px; margin-bottom: 22px; }
      .swatch { width: 28px; height: 28px; border: 0; border-radius: 50%; cursor: pointer; outline: 2px solid transparent; outline-offset: 3px; transition: outline-color 0.15s ease, transform 0.12s ease; }
      .swatch:hover { transform: scale(1.1); }
      .swatch.picked { outline-color: var(--ink); }
      .actions { display: flex; justify-content: flex-end; gap: 10px; }
      .button { padding: 10px 16px; border: 1px solid var(--line); border-radius: 11px; background: transparent; font-weight: 600; cursor: pointer; }
      .button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
      .button.primary:hover { filter: brightness(1.07); }

      .palette { width: 540px; padding: 0; overflow: hidden; align-self: start; margin-top: 16vh; }
      .palette input { width: 100%; padding: 18px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 17px; outline: none; }
      .commands { margin: 0; padding: 8px; list-style: none; }
      .command { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; cursor: pointer; }
      .command.selected { background: var(--soft); }
      .command small { margin-left: auto; color: var(--muted); }
      .glyph { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); font-size: 14px; }
      .command.selected .glyph { background: var(--accent); color: var(--accent-ink); }

      .toast {
        position: fixed; left: 50%; bottom: 28px; padding: 12px 18px; border-radius: 999px; background: var(--ink); color: var(--bg);
        font-weight: 600; box-shadow: 0 12px 30px rgba(10, 8, 30, 0.3); transform: translate(-50%, 30px); opacity: 0;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
      }
      .toast.show { transform: translate(-50%, 0); opacity: 1; }

      @media (max-width: 720px) {
        .app { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .topbar { padding: 14px 16px 6px; }
        .search { flex: 1; width: auto; }
        .search kbd, .spacer { display: none; }
        .project { padding: 10px 16px 32px; }
        .project-head { gap: 14px; padding: 20px; }
        h1 { font-size: 23px; }
        .ring, .ring svg { width: 74px; height: 74px; }
        .ring b { font-size: 16px; }
        .task { padding: 15px 14px; }
        .sheet, .palette { width: calc(100vw - 32px); }
        .toast { bottom: 22px; white-space: nowrap; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <svg viewBox="0 0 26 26" aria-hidden="true">
            <rect width="26" height="26" rx="8" fill="var(--accent)" />
            <path d="M8 7v12h10" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Lumen
        </div>
        <div class="label">Projects</div>
        <nav id="projects"></nav>
        <button class="new-project" id="new-project" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
          New project
        </button>
      </aside>

      <main>
        <header class="topbar">
          <button class="search" id="open-palette" type="button">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
            <span>Search or run a command</span>
            <kbd id="shortcut">Ctrl K</kbd>
          </button>
          <div class="spacer"></div>
          <button class="icon-button" id="theme" type="button" aria-label="Toggle dark mode">
            <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M15.5 10.6A6.8 6.8 0 0 1 7.4 2.5a6.8 6.8 0 1 0 8.1 8.1Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" /></svg>
          </button>
          <div class="avatar" aria-hidden="true">ZA</div>
        </header>

        <section class="project">
          <div class="project-head">
            <div>
              <p class="eyebrow">Project</p>
              <h1 id="title"></h1>
              <p class="summary" id="summary"></p>
            </div>
            <div class="ring" aria-hidden="true">
              <svg viewBox="0 0 92 92">
                <circle class="track" cx="46" cy="46" r="38" />
                <circle class="value" id="ring-value" cx="46" cy="46" r="38" />
              </svg>
              <b id="percent"></b>
            </div>
          </div>
          <form class="add" id="add" autocomplete="off">
            <input id="task-input" placeholder="Add a task" aria-label="Add a task" />
          </form>
          <ul class="tasks" id="tasks"></ul>
        </section>
      </main>
    </div>

    <div class="overlay" id="project-overlay">
      <form class="sheet" id="project-form" autocomplete="off">
        <h2>New project</h2>
        <label class="field">Project name
          <input id="project-name" placeholder="For example: Website launch" />
        </label>
        <div class="swatches" id="swatches"></div>
        <div class="actions">
          <button class="button" type="button" id="cancel-project">Cancel</button>
          <button class="button primary" type="submit">Create project</button>
        </div>
      </form>
    </div>

    <div class="overlay" id="palette-overlay">
      <div class="sheet palette">
        <input id="palette-input" placeholder="Type a command" aria-label="Type a command" />
        <ul class="commands" id="commands"></ul>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script>
      const COLORS = ['#6d4aff', '#ff6b9a', '#ffa23a', '#22b8a0', '#3b8cff'];
      const state = {
        current: 0,
        color: COLORS[0],
        projects: [
          {
            name: 'Mobile app redesign', color: '#ff6b9a',
            tasks: [
              { text: 'Audit the current onboarding flow', done: true },
              { text: 'Sketch three home screen options', done: true },
              { text: 'Review the new icons with the team', done: false },
              { text: 'Prototype the checkout in Figma', done: false },
            ],
          },
          { name: 'Q4 planning', color: '#22b8a0', tasks: [{ text: 'Collect goals from each team', done: false }] },
        ],
      };

      const $ = (id) => document.getElementById(id);
      const escapeHtml = (text) => text.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const CIRCUMFERENCE = 2 * Math.PI * 38;

      function render({ animateLast = false } = {}) {
        const project = state.projects[state.current];
        $('projects').innerHTML = state.projects
          .map((p, i) => `<button class="project-link ${i === state.current ? 'active' : ''}" data-index="${i}" type="button">
              <i class="dot" style="background:${p.color}"></i>${escapeHtml(p.name)}
              <span class="count">${p.tasks.filter((t) => !t.done).length}</span></button>`)
          .join('');

        const done = project.tasks.filter((t) => t.done).length;
        const total = project.tasks.length;
        const ratio = total ? done / total : 0;
        $('title').textContent = project.name;
        $('summary').textContent = total ? `${done} of ${total} tasks done` : 'No tasks yet';
        $('percent').textContent = `${Math.round(ratio * 100)}%`;
        const ring = $('ring-value');
        ring.style.strokeDasharray = CIRCUMFERENCE;
        ring.style.strokeDashoffset = CIRCUMFERENCE * (1 - ratio);
        ring.style.stroke = project.color;

        $('tasks').innerHTML = total
          ? project.tasks
              .map((t, i) => `<li><label class="task ${t.done ? 'done' : ''}" ${animateLast && i === total - 1 ? '' : 'style="animation:none"'}>
                  <input type="checkbox" data-index="${i}" ${t.done ? 'checked' : ''} />
                  <i class="box"><svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" stroke-linecap="round" stroke-linejoin="round" /></svg></i>
                  <span>${escapeHtml(t.text)}</span></label></li>`)
              .join('')
          : '<li class="empty">Nothing here yet. Add your first task above.</li>';
      }

      function toast(message) {
        const el = $('toast');
        el.textContent = message;
        el.classList.add('show');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove('show'), 2400);
      }

      // ---- tasks
      $('add').addEventListener('submit', (event) => {
        event.preventDefault();
        const text = $('task-input').value.trim();
        if (!text) return;
        state.projects[state.current].tasks.push({ text, done: false });
        $('task-input').value = '';
        render({ animateLast: true });
      });
      $('tasks').addEventListener('change', (event) => {
        const index = event.target.dataset.index;
        if (index === undefined) return;
        const task = state.projects[state.current].tasks[index];
        task.done = event.target.checked;
        // Update in place so the check mark and the ring animate instead of redrawing.
        event.target.closest('.task').classList.toggle('done', task.done);
        const project = state.projects[state.current];
        const done = project.tasks.filter((t) => t.done).length;
        $('summary').textContent = `${done} of ${project.tasks.length} tasks done`;
        $('percent').textContent = `${Math.round((done / project.tasks.length) * 100)}%`;
        $('ring-value').style.strokeDashoffset = CIRCUMFERENCE * (1 - done / project.tasks.length);
        const link = document.querySelector('.project-link.active .count');
        if (link) link.textContent = project.tasks.length - done;
        if (done === project.tasks.length) toast('All done. Nice work!');
      });
      $('projects').addEventListener('click', (event) => {
        const link = event.target.closest('.project-link');
        if (!link) return;
        state.current = Number(link.dataset.index);
        render();
      });

      // ---- new project
      function openProject() {
        $('project-name').value = '';
        $('swatches').innerHTML = COLORS.map((c) => `<button type="button" class="swatch ${c === state.color ? 'picked' : ''}" data-color="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join('');
        $('project-overlay').classList.add('open');
        setTimeout(() => $('project-name').focus(), 60);
      }
      const closeProject = () => $('project-overlay').classList.remove('open');
      $('new-project').addEventListener('click', openProject);
      $('cancel-project').addEventListener('click', closeProject);
      $('swatches').addEventListener('click', (event) => {
        const swatch = event.target.closest('.swatch');
        if (!swatch) return;
        state.color = swatch.dataset.color;
        document.querySelectorAll('.swatch').forEach((el) => el.classList.toggle('picked', el === swatch));
      });
      $('project-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const name = $('project-name').value.trim();
        if (!name) return $('project-name').focus();
        state.projects.push({ name, color: state.color, tasks: [] });
        state.current = state.projects.length - 1;
        closeProject();
        render();
        toast(`Created "${name}"`);
        setTimeout(() => $('task-input').focus(), 80);
      });

      // ---- theme
      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        $('theme').setAttribute('aria-label', theme === 'dark' ? 'Toggle light mode' : 'Toggle dark mode');
      }
      const toggleTheme = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
      $('theme').addEventListener('click', toggleTheme);

      // ---- command palette
      const commands = () => [
        { glyph: '◐', name: document.documentElement.dataset.theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode', hint: 'Theme', run: toggleTheme },
        { glyph: '+', name: 'New project', hint: 'Create', run: openProject },
        {
          glyph: '↓', name: 'Export tasks as CSV', hint: 'Export',
          run: () => toast(`Exported ${state.projects[state.current].tasks.length} tasks`),
        },
        {
          glyph: '✓', name: 'Mark every task as done', hint: 'Tasks',
          run: () => {
            state.projects[state.current].tasks.forEach((t) => (t.done = true));
            render();
            toast('All done. Nice work!');
          },
        },
      ];
      let matches = [];
      let selected = 0;
      function renderCommands() {
        const query = $('palette-input').value.trim().toLowerCase();
        matches = commands().filter((c) => c.name.toLowerCase().includes(query));
        selected = Math.min(selected, Math.max(0, matches.length - 1));
        $('commands').innerHTML = matches.length
          ? matches.map((c, i) => `<li class="command ${i === selected ? 'selected' : ''}" data-index="${i}"><i class="glyph">${c.glyph}</i>${c.name}<small>${c.hint}</small></li>`).join('')
          : '<li class="command">No matching command</li>';
      }
      function openPalette() {
        $('palette-input').value = '';
        selected = 0;
        renderCommands();
        $('palette-overlay').classList.add('open');
        setTimeout(() => $('palette-input').focus(), 40);
      }
      const closePalette = () => $('palette-overlay').classList.remove('open');
      function runSelected() {
        const command = matches[selected];
        closePalette();
        if (command) setTimeout(command.run, 140);
      }
      $('open-palette').addEventListener('click', openPalette);
      $('palette-input').addEventListener('input', () => { selected = 0; renderCommands(); });
      $('palette-input').addEventListener('keydown', (event) => {
        if (event.key === 'ArrowDown') { selected = Math.min(selected + 1, matches.length - 1); renderCommands(); event.preventDefault(); }
        if (event.key === 'ArrowUp') { selected = Math.max(selected - 1, 0); renderCommands(); event.preventDefault(); }
        if (event.key === 'Enter') { runSelected(); event.preventDefault(); }
      });
      $('commands').addEventListener('click', (event) => {
        const item = event.target.closest('.command');
        if (!item || item.dataset.index === undefined) return;
        selected = Number(item.dataset.index);
        runSelected();
      });
      document.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') { event.preventDefault(); openPalette(); }
        if (event.key === 'Escape') { closePalette(); closeProject(); }
      });
      document.querySelectorAll('.overlay').forEach((overlay) =>
        overlay.addEventListener('mousedown', (event) => { if (event.target === overlay) { closePalette(); closeProject(); } }),
      );

      $('shortcut').textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? '⌘K' : 'Ctrl K';
      render();
    </script>
  </body>
</html>
